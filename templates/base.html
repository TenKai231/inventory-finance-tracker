<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}InventoTrack{% endblock %}</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Alpine.js (Harus defer agar dieksekusi setelah halaman dimuat) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Local Tailwind CSS Output -->
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Konfigurasi Tema Tailwind bawaan dari Google Stitch -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#fffbff",
              "on-secondary-fixed": "#07006c",
              "secondary-fixed-dim": "#c0c1ff",
              "secondary-container": "#6063ee",
              "surface-variant": "#e4e2e4",
              "primary-container": "#131b2e",
              "inverse-primary": "#bec6e0",
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#98805d",
              "primary-fixed": "#dae2fd",
              "on-tertiary-fixed": "#271901",
              "outline-variant": "#c6c6cd",
              "on-tertiary-fixed-variant": "#574425",
              "inverse-surface": "#303032",
              "on-background": "#1b1b1d",
              "on-primary-container": "#7c839b",
              "secondary": "#6366F1",
              "surface": "#fcf8fa",
              "tertiary-fixed-dim": "#dec29a",
              "error-container": "#ffdad6",
              "tertiary": "#000000",
              "on-secondary": "#ffffff",
              "surface-dim": "#dcd9db",
              "surface-container-highest": "#e4e2e4",
              "primary": "#0F172A",
              "surface-container-high": "#eae7e9",
              "surface-container-low": "#f6f3f5",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#f3f0f2",
              "outline": "#E2E8F0",
              "tertiary-container": "#271901",
              "secondary-fixed": "#e1e0ff",
              "on-primary-fixed": "#131b2e",
              "on-primary-fixed-variant": "#3f465c",
              "surface-bright": "#fcf8fa",
              "error": "#ba1a1a",
              "on-error-container": "#93000a",
              "on-error": "#ffffff",
              "tertiary-fixed": "#fcdeb5",
              "primary-fixed-dim": "#bec6e0",
              "surface-container": "#f0edef",
              "surface-tint": "#565e74",
              "on-surface-variant": "#64748B",
              "on-primary": "#ffffff",
              "on-secondary-fixed-variant": "#2f2ebe",
              "on-surface": "#1b1b1d",
              "background": "#F8FAFC"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              "mono-data": ["monospace"]
            },
            fontSize: {
              "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
              "h3": ["18px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
              "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
              "body-md": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
              "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background font-sans antialiased text-on-background">
    <!-- Area ini akan diisi oleh halaman spesifik (seperti login, dashboard, dll) -->
    {% block content %}{% endblock %}
</body>
</html>
